server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    # Reverse proxy /api to the Node.js backend container
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Block public access to prediction-cache or training-status endpoints directly
    location /prediction-cache/ {
        return 403;
    }

    # Return 404 for any other route (since frontend is hosted on S3/CloudFront)
    location / {
        return 404;
    }
}
