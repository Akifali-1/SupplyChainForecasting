name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - 'SupplyGraph/Frontend/**'
      - '.github/workflows/deploy-frontend.yml'

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './SupplyGraph/Frontend/package-lock.json'

      - name: Install dependencies
        working-directory: ./SupplyGraph/Frontend
        run: npm install --legacy-peer-deps

      - name: Build Frontend
        working-directory: ./SupplyGraph/Frontend
        env:
          REACT_APP_API_BASE: http://${{ secrets.EC2_HOST }}
          CI: false
        run: npm run build

      - name: Deploy to S3
        run: |
          aws s3 sync ./SupplyGraph/Frontend/build/ s3://${{ secrets.S3_FRONTEND_BUCKET }} --delete

      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ secrets.CF_DISTRIBUTION_ID }} --paths "/*"
